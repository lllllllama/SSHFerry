[project]
name = "sshferry"
version = "0.1.2"
description = "SSH/SFTP GUI file management and transfer tool"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0,<6.8",
    "fastapi>=0.118.0,<0.119",
    "paramiko>=3.4.0",
    "cryptography>=41.0.0",
    "scp>=0.15.0",
    "uvicorn>=0.35.0,<0.36",
]

[project.scripts]
sshferry = "src.app.main:main"
sshferry-backend = "backend.app.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.1.0",
]
build = [
    "pyinstaller>=6.6.0,<6.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=backend --cov-report=term-missing --cov-fail-under=99"
